groups:
  - name: wms-backend
    rules:
      - alert: WmsBackendDown
        expr: up{job="wms-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: WMS backend metrics endpoint is unavailable
          description: Prometheus has been unable to scrape the WMS backend for more than one minute.

      - alert: WmsHighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="wms-backend",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="wms-backend"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WMS HTTP 5xx rate is above 5 percent
          description: More than 5 percent of backend requests have returned 5xx responses for five minutes.

      - alert: WmsHikariPoolNearExhaustion
        expr: |
          max(hikaricp_connections_active{job="wms-backend"})
          /
          clamp_min(max(hikaricp_connections_max{job="wms-backend"}), 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WMS database connection pool is near exhaustion
          description: More than 80 percent of the Hikari connection pool has been active for five minutes.

      - alert: WmsRepeatedBusinessOperationFailures
        expr: increase(wms_business_operation_seconds_count{outcome="failure"}[10m]) > 3
        labels:
          severity: warning
        annotations:
          summary: A critical WMS operation is repeatedly failing
          description: "Operation {{ $labels.operation }} failed more than three times during the last ten minutes."

      - alert: WmsSlowBusinessOperation
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, operation) (rate(wms_business_operation_seconds_bucket[5m]))
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A critical WMS operation has high latency
          description: "The p95 latency of {{ $labels.operation }} has exceeded three seconds for five minutes."
